name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      # Not: `next build` burada bilerek çalıştırılmıyor çünkü Prisma client'ın
      # üretilmesi ve build-time ortam değişkenleri (DATABASE_URL vb.) gerektirir.
      # İstersen ayrı bir "build" job'ı olarak, gerekli secret'ları GitHub
      # Actions'a repo secret'ı olarak ekledikten sonra genişletebiliriz.
